[project]
name = "brushjam-stream-worker"
version = "0.1.0"
description = "Model-resident few-step SDXL img2img worker for Brush Jam"
readme = "README.md"
license = "MIT"
# 3.10 is the version the StreamDiffusion ecosystem targets; it was kept after
# the evaluation (see docs/STREAM_WORKER.md) so that fork stays installable in
# this venv without a Python change. diffusers/torch work on 3.10-3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "peft>=0.13",
    "safetensors>=0.4",
    "omegaconf>=2.3",
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
stream-worker = "stream_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_worker"]

# torch must come from the CUDA index, not PyPI (PyPI ships the CPU build on Windows).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
