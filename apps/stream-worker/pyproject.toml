[project]
name = "brushjam-stream-worker"
version = "0.1.0"
description = "Model-resident few-step SDXL img2img worker for Brush Jam"
readme = "README.md"
license = "MIT"
# 3.10 is the version the StreamDiffusion ecosystem targets; it was kept after
# the evaluation (see docs/STREAM_WORKER.md) so that fork stays installable in
# this venv without a Python change. diffusers/torch work on 3.10-3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    # The model pipeline is the room server's, imported rather than copied:
    # brushjam.ai.pipeline. The `inproc` extra is the GPU stack it needs
    # (torch, diffusers, transformers, accelerate, peft, safetensors,
    # huggingface-hub), so this worker no longer pins those itself.
    "brushjam[inproc]",
    # What the worker's own HTTP surface needs directly.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
stream-worker = "stream_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_worker"]

# torch must come from the CUDA index, not PyPI (PyPI ships the CPU build on Windows).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
# Editable, and by path: the worker and the room server run the same pipeline
# file, and an edit to it has to reach both without a reinstall.
brushjam = { path = "../brushjam", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
